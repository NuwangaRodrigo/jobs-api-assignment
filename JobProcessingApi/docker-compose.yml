version: '3.8'

services:
  jobprocessingapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobprocessing-api
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=YourSuperSecretKeyThatShouldBeStoredSecurely12345
      - Jwt__Issuer=JobProcessingApi
      - Jwt__Audience=JobProcessingApiClients
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - jobprocessing-network

networks:
  jobprocessing-network:
    driver: bridge
